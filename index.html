<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF6F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mealzy" />
  <title>Mealzy — High-Protein Meal Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root, [data-theme="light"] {
      --bg: #FAF6F0;
      --bg-elevated: #F3ECE1;
      --surface: #FFFFFF;
      --ink: #1C1917;
      --ink-muted: #57534E;
      --ink-faint: #A8A29E;
      --accent: #C84B31;
      --accent-soft: rgba(200, 75, 49, 0.12);
      --sage: #3F624D;
      --sage-soft: rgba(63, 98, 77, 0.12);
      --line: rgba(28, 25, 23, 0.1);
      --shadow: 0 8px 28px rgba(28, 25, 23, 0.08);
      --protein: #3F624D;
      --carbs: #C84B31;
      --fat: #B45309;
      --kcal: #1C1917;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --nav-h: 76px;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #121110;
      --bg-elevated: #1C1A17;
      --surface: #1C1A17;
      --ink: #F5EFE6;
      --ink-muted: #A8A29E;
      --ink-faint: #78716C;
      --accent: #E06348;
      --accent-soft: rgba(224, 99, 72, 0.16);
      --sage: #6B9E78;
      --sage-soft: rgba(107, 158, 120, 0.16);
      --line: rgba(245, 239, 230, 0.1);
      --shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      --protein: #6B9E78;
      --carbs: #E06348;
      --fat: #F59E0B;
      --kcal: #F5EFE6;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
      scroll-padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
    }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, var(--accent-soft), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, var(--sage-soft), transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100dvh;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 48px);
    }
    body.sheet-open {
      overflow: hidden;
    }
    button, input, select { font: inherit; color: inherit; }
    button {
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
    }
    a { color: var(--accent); }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .serif { font-family: "Fraunces", Georgia, serif; }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      border-bottom: 1px solid var(--line);
      padding: calc(10px + var(--safe-top)) 16px 10px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
    }
    .brand-name {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .brand-name span { color: var(--accent); font-style: italic; font-weight: 600; }
    .brand-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--ink);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .icon-btn:active { transform: scale(0.96); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Day scrubber */
    .day-scrubber {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .day-scrubber::-webkit-scrollbar { display: none; }
    .day-pill {
      flex: 0 0 auto;
      min-width: 58px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      text-align: center;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .day-pill .d-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .day-pill .d-num {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.2;
    }
    .day-pill .d-wd {
      font-size: 0.68rem;
      color: var(--ink-muted);
    }
    .day-pill.is-today { border-color: color-mix(in srgb, var(--sage) 55%, var(--line)); }
    .day-pill.is-today .d-label { color: var(--sage); }
    .day-pill.is-active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }
    .day-pill.is-active .d-label,
    .day-pill.is-active .d-wd { color: color-mix(in srgb, var(--bg) 70%, transparent); }
    .day-pill:focus-visible,
    .icon-btn:focus-visible,
    .nav-item:focus-visible,
    .btn:focus-visible,
    .filter-chip:focus-visible,
    .lib-item:focus-visible,
    .day-row:focus-visible,
    .serving-toggle button:focus-visible,
    .search-input:focus-visible,
    .field input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .back-today {
      display: none;
      margin-top: 10px;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
    }
    .back-today.visible { display: inline-flex; }

    /* Main */
    main { padding: 16px 16px 8px; max-width: 720px; margin: 0 auto; }
    .view { display: none; animation: fadeIn 0.28s ease; }
    .view.is-active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .issue-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 14px;
    }
    .issue-banner h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.6rem, 5.5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .issue-banner h1 em {
      font-style: italic;
      color: var(--accent);
      font-weight: 600;
    }
    .issue-meta {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: var(--ink-muted);
      text-align: right;
      line-height: 1.4;
    }

    /* Macro cards */
    .macro-summary {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .macro-summary-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .macro-summary-head h2 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .macro-cell {
      text-align: center;
      padding: 10px 4px;
      border-radius: 14px;
      background: var(--bg-elevated);
    }
    .macro-cell .val {
      font-family: "JetBrains Mono", monospace;
      font-weight: 600;
      font-size: 1.05rem;
      display: block;
    }
    .macro-cell .lbl {
      font-size: 0.65rem;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .macro-cell.protein .val { color: var(--protein); }
    .macro-cell.carbs .val { color: var(--carbs); }
    .macro-cell.fat .val { color: var(--fat); }
    .macro-bars {
      display: flex;
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 12px;
      background: var(--bg-elevated);
    }
    .macro-bars span { display: block; height: 100%; }
    .macro-bars .p { background: var(--protein); }
    .macro-bars .c { background: var(--carbs); }
    .macro-bars .f { background: var(--fat); }

    /* Recipe card */
    .meal-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 10px;
    }
    .meal-label .num {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.06em;
    }
    .meal-label .type {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-muted);
    }
    .meal-label .rule {
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .recipe-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }
    .video-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0c0b0a;
      overflow: hidden;
    }
    .video-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.92;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.45));
      cursor: pointer;
    }
    .play-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 92%, #fff);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      transition: transform 0.15s ease;
    }
    .play-overlay:active .play-btn { transform: scale(0.95); }
    .play-btn svg { width: 26px; height: 26px; margin-left: 3px; }

    /* Video overlay player */
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 12px 24px;
      padding-top: calc(56px + var(--safe-top));
      padding-bottom: calc(24px + var(--safe-bottom));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }
    .video-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .video-close {
      position: absolute;
      top: calc(12px + var(--safe-top));
      right: calc(12px + env(safe-area-inset-right, 0px));
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .video-close:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.28); }
    .video-close:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .video-close svg { width: 20px; height: 20px; }
    .video-overlay-player {
      width: min(100%, 920px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      transform: scale(0.96);
      transition: transform 0.22s ease;
    }
    .video-overlay.open .video-overlay-player { transform: scale(1); }
    .video-overlay-player iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .print-exclusive {
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      background:
        linear-gradient(145deg, var(--bg-elevated), var(--surface)),
        repeating-linear-gradient(-45deg, transparent, transparent 8px, var(--line) 8px, var(--line) 9px);
    }
    .print-exclusive .badge {
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sage);
      background: var(--sage-soft);
      padding: 6px 10px;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .print-exclusive h3 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .print-exclusive p {
      margin: 8px 0 0;
      color: var(--ink-muted);
      font-size: 0.88rem;
      max-width: 28ch;
    }

    .recipe-body { padding: 16px 16px 18px; }
    .recipe-title {
      margin: 0 0 6px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .recipe-adj {
      margin: 0 0 12px;
      font-size: 0.86rem;
      color: var(--ink-muted);
    }
    .yt-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      color: var(--ink-muted);
    }
    .yt-link:hover { color: var(--accent); }

    .recipe-macros {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .rm-cell {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
    }
    .rm-cell .v {
      font-family: "JetBrains Mono", monospace;
      font-weight: 600;
      font-size: 0.92rem;
    }
    .rm-cell .l {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-faint);
    }

    .serving-toggle {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      padding: 4px;
      background: var(--bg-elevated);
      border-radius: 14px;
    }
    .serving-toggle button {
      flex: 1;
      padding: 10px 8px;
      border-radius: 11px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-muted);
    }
    .serving-toggle button.is-on {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .ingredients {
      list-style: none;
      margin: 0 0 16px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ingredients li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--bg-elevated);
      font-size: 0.9rem;
    }
    .ingredients label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: pointer;
      width: 100%;
    }
    .ingredients input {
      margin-top: 3px;
      accent-color: var(--sage);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .ingredients li.checked span {
      text-decoration: line-through;
      color: var(--ink-faint);
    }
    .steps {
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: step;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .steps li {
      position: relative;
      padding: 12px 12px 12px 48px;
      border-radius: 14px;
      border: 1px solid var(--line);
      font-size: 0.92rem;
      color: var(--ink);
    }
    .steps li::before {
      counter-increment: step;
      content: counter(step, decimal-leading-zero);
      position: absolute;
      left: 12px;
      top: 12px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
    }
    .temp-badge {
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
    }

    /* Schedule view */
    .week-block { margin-bottom: 22px; }
    .week-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.4rem;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    .day-row {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s;
    }
    .day-row.is-today { border-color: var(--sage); }
    .day-row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .day-row-top .dn {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .day-row-top .macros {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: var(--ink-muted);
    }
    .day-row-meals {
      display: grid;
      gap: 6px;
      font-size: 0.86rem;
    }
    .day-row-meals .m {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 8px;
    }
    .day-row-meals .tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      padding-top: 3px;
    }

    /* Library */
    .lib-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      outline: none;
      font-size: 16px;
    }
    .search-input:focus { border-color: var(--accent); }
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-muted);
    }
    .filter-chip.is-on {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }
    .lib-item {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .lib-item .li-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .lib-item .li-cat {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--sage);
    }
    .lib-item .li-macros {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      color: var(--ink-muted);
    }
    .lib-item .li-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
    }

    /* Rules */
    .rules-intro {

      padding: 16px;
      margin-bottom: 10px;

    }
    .rule-card p {

    }

      display: inline-block;
      margin-top: 8px;

      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 8px;
      border-radius: 8px;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 60;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 12px 20px calc(24px + var(--safe-bottom));
      transform: translateY(110%);
      transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.2, 1);
      max-height: 85dvh;
      overflow-y: auto;
      border: 1px solid var(--line);
      visibility: hidden;
    }
    .drawer.open {
      transform: translateY(0);
      visibility: visible;
    }
    .drawer-handle {
      width: 40px; height: 4px;
      border-radius: 99px;
      background: var(--ink-faint);
      margin: 0 auto 16px;
    }
    .drawer h2 {
      margin: 0 0 16px;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.35rem;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }
    .field input[type="date"] {
      font-size: 16px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .toggle-row span { font-size: 0.92rem; font-weight: 500; }
    .switch {
      width: 48px; height: 28px;
      border-radius: 99px;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      position: relative;
      transition: background 0.2s;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px; left: 2px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--ink);
      transition: transform 0.2s;
    }
    .switch.on { background: var(--sage-soft); border-color: var(--sage); }
    .switch.on::after { transform: translateX(20px); background: var(--sage); }

    /* Recipe detail modal overlay for library */
    .detail-sheet {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: var(--bg);
      overflow-y: auto;
      padding: calc(12px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      transform: translateY(100%);

      visibility: hidden;
      pointer-events: none;

    .detail-sheet.open {
      transform: translateY(0);
      visibility: visible;

    .bottom-nav {

    }

    @media (min-width: 640px) {

      .recipe-title { font-size: 1.5rem; }
    }

  /* ========== STATE ========== */
  const STORAGE = {
    startDate: "mealzy_startDate",
    theme: "mealzy_theme",

    checks: "mealzy_checks_"
  };

  const state = {
    view: "today",

  function mondayOfThisWeek(d = new Date()) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = x.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    return x;
  }

  function toISODate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function parseISODate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function daysBetween(a, b) {
    const ms = 86400000;
    const ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    const ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.floor((ub - ua) / ms);
  }

  function getPlanDayForDate(date) {
    const start = parseISODate(state.startDate);
    const diff = daysBetween(start, date);
    return ((diff % 14) + 14) % 14 + 1;
  }

  function getTodayPlanDay() {
    return getPlanDayForDate(new Date());
  }

  function dateForPlanDay(planDay) {
    const start = parseISODate(state.startDate);
    const todayDay = getTodayPlanDay();
    const offset = planDay - todayDay;
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + offset);
    return d;
  }

  function weekdayShort(d) {
    return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()];
  }

  function formatNiceDate(d) {
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  function getServingChoice(recipeId) {
    return localStorage.getItem(STORAGE.serving + recipeId) || "rice";
  }

  function setServingChoice(recipeId, choice) {
    localStorage.setItem(STORAGE.serving + recipeId, choice);
  }

  function getRecipeMacros(recipe) {
    if (!recipe.servingOptions) return { ...recipe.macros };
    const choice = getServingChoice(recipe.id);
    return choice === "roti" ? { ...recipe.macrosRoti } : { ...recipe.macrosRice };
  }

  function addMacros(a, b) {
    return {
      kcal: a.kcal + b.kcal,
      protein: a.protein + b.protein,
      carbs: a.carbs + b.carbs,
      fat: a.fat + b.fat
    };
  }

  function macroBarPercents(m) {
    const p = m.protein * 4, c = m.carbs * 4, f = m.fat * 9;
    const t = p + c + f || 1;
    return { p: (p / t) * 100, c: (c / t) * 100, f: (f / t) * 100 };
  }

  /* ========== RENDER HELPERS ========== */
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMacroCells(m, compact) {
    const cls = compact ? "recipe-macros" : "macro-grid";
    const cell = compact ? "rm-cell" : "macro-cell";
    return `
      <div class="${cls}">
        <div class="${cell}"><span class="${compact ? "v" : "val"}">${m.kcal}</span><span class="${compact ? "l" : "lbl"}">kcal</span></div>
        <div class="${cell} protein"><span class="${compact ? "v" : "val"}">${m.protein}g</span><span class="${compact ? "l" : "lbl"}">Protein</span></div>
        <div class="${cell} carbs"><span class="${compact ? "v" : "val"}">${m.carbs}g</span><span class="${compact ? "l" : "lbl"}">Carbs</span></div>
        <div class="${cell} fat"><span class="${compact ? "v" : "val"}">${m.fat}g</span><span class="${compact ? "l" : "lbl"}">Fat</span></div>
      </div>`;
  }

  function renderMacroBars(m) {
    const b = macroBarPercents(m);
    return `<div class="macro-bars" title="Approx calorie split"><span class="p" style="width:${b.p}%"></span><span class="c" style="width:${b.c}%"></span><span class="f" style="width:${b.f}%"></span></div>`;
  }

  function checkKey(recipeId, idx) {
    return `${recipeId}:${idx}`;
  }

  function isChecked(recipeId, idx) {
    try {
      const raw = localStorage.getItem(STORAGE.checks + recipeId);
      if (!raw) return false;
      return JSON.parse(raw).includes(idx);
    } catch { return false; }
  }

  function toggleCheck(recipeId, idx) {
    let arr = [];
    try {
      arr = JSON.parse(localStorage.getItem(STORAGE.checks + recipeId) || "[]");
    } catch { arr = []; }
    if (arr.includes(idx)) arr = arr.filter(i => i !== idx);
    else arr.push(idx);
    localStorage.setItem(STORAGE.checks + recipeId, JSON.stringify(arr));
  }

  function renderVideo(recipe) {
    if (!recipe.video) {
      return `
        <div class="print-exclusive">
          <div>
            <div class="badge">Print Exclusive</div>
            <h3 class="serif">Recipe Below</h3>
            <p>No video in the plan — follow the steps on this card.</p>
          </div>
        </div>`;
    }
    return `
      <div class="video-wrap" data-video-id="${recipe.id}">
        <img src="https://i.ytimg.com/vi/${recipe.video}/hqdefault.jpg" alt="" loading="lazy" />
        <button class="play-overlay" data-play="${recipe.id}" aria-label="Play video">
          <span class="play-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </span>
        </button>
      </div>`;
  }

  function isDetailOpen() {
    return document.getElementById("detailSheet").classList.contains("open");
  }

  function isVideoOpen() {
    return document.getElementById("videoOverlay").classList.contains("open");
  }

  function openVideoOverlay(recipeId) {
    const recipe = RECIPES[recipeId];
    if (!recipe || !recipe.video) return;
    closeDrawer();
    state.activeVideoId = recipeId;
    const overlay = document.getElementById("videoOverlay");
    const frame = document.getElementById("videoFrame");
    frame.src = `https://www.youtube-nocookie.com/embed/${recipe.video}?playsinline=1&autoplay=1&rel=0`;
    frame.title = recipe.title;
    overlay.classList.add("open");
    overlay.removeAttribute("inert");
    overlay.setAttribute("aria-hidden", "false");
    document.body.classList.add("sheet-open");
    setAppChromeInert(true);
    if (isDetailOpen()) {
      document.getElementById("detailSheet").setAttribute("inert", "");
    }
    requestAnimationFrame(() => {
      document.getElementById("videoClose").focus();
    });
  }

  function closeVideoOverlay() {
    const overlay = document.getElementById("videoOverlay");
    if (!overlay.classList.contains("open") && !state.activeVideoId) return;
    state.activeVideoId = null;
    const frame = document.getElementById("videoFrame");
    frame.removeAttribute("src");
    frame.src = "about:blank";
    frame.title = "Recipe video";
    overlay.classList.remove("open");
    overlay.setAttribute("inert", "");
    overlay.setAttribute("aria-hidden", "true");
    if (isDetailOpen()) {
      document.getElementById("detailSheet").removeAttribute("inert");
      document.body.classList.add("sheet-open");
      setAppChromeInert(true);
    } else {
      document.body.classList.remove("sheet-open");
      setAppChromeInert(false);
    }
  }

  function renderRecipeCard(recipe, opts = {}) {
    const macros = getRecipeMacros(recipe);
    const mealType = opts.mealType || (recipe.category === "snack" ? "Afternoon Snack" : recipe.category === "bonus" ? "Bonus" : "Evening Dinner");
    const mealNum = opts.mealNum || String(recipe.num).padStart(2, "0");

    let servingToggle = "";
    if (recipe.servingOptions) {
      const choice = getServingChoice(recipe.id);
      servingToggle = `
        <div class="serving-toggle" data-serving-recipe="${recipe.id}">
          <button type="button" data-choice="rice" class="${choice === "rice" ? "is-on" : ""}">With 200g Rice</button>
          <button type="button" data-choice="roti" class="${choice === "roti" ? "is-on" : ""}">With 3 Rotis</button>
        </div>`;
    }

    const yt = recipe.video
      ? `<a class="yt-link" href="https://www.youtube.com/watch?v=${recipe.video}" target="_blank" rel="noopener">Watch on YouTube ↗</a>`
      : "";

    const ingredients = recipe.ingredients.map((ing, i) => {
      const checked = isChecked(recipe.id, i);
      return `
        <li class="${checked ? "checked" : ""}">
          <label>
            <input type="checkbox" data-check="${recipe.id}" data-idx="${i}" ${checked ? "checked" : ""} />
            <span>${escapeHtml(ing)}</span>
          </label>
        </li>`;
    }).join("");

    const steps = recipe.steps.map(s => `<li>${s}</li>`).join("");

    return `
      <div class="meal-label">
        <span class="num">${mealNum}</span>
        <span class="type">${mealType}</span>
        <span class="rule"></span>
      </div>
      <article class="recipe-card" data-recipe="${recipe.id}">
        ${renderVideo(recipe)}
        <div class="recipe-body">
          <h3 class="recipe-title">${escapeHtml(recipe.title)}</h3>
          <p class="recipe-adj">${escapeHtml(recipe.adjustments)}</p>
          ${yt}
          ${renderMacroCells(macros, true)}
          ${servingToggle}
          <h4 class="section-title">Ingredients</h4>
          <ul class="ingredients">${ingredients}</ul>
          <h4 class="section-title">Method</h4>
          <ol class="steps">${steps}</ol>
        </div>
      </article>`;
  }

  /* ========== VIEWS ========== */
  function renderDayScrubber() {
    const el = document.getElementById("dayScrubber");
    const todayDay = getTodayPlanDay();
    el.innerHTML = SCHEDULE.map(s => {
      const d = dateForPlanDay(s.day);
      const active = s.day === state.selectedDay ? "is-active" : "";
      const today = s.day === todayDay ? "is-today" : "";
      return `
        <button class="day-pill ${active} ${today}" data-day="${s.day}" aria-label="Day ${s.day}${s.day === todayDay ? " (today)" : ""}" aria-pressed="${s.day === state.selectedDay ? "true" : "false"}" ${s.day === state.selectedDay ? 'aria-current="date"' : ""}>
          <div class="d-label">${s.day === todayDay ? "Today" : "Day"}</div>
          <div class="d-num">${s.day}</div>
          <div class="d-wd">${weekdayShort(d)}</div>
        </button>`;
    }).join("");

    const back = document.getElementById("backToday");
    back.classList.toggle("visible", state.selectedDay !== todayDay && state.view === "today");
  }

  function renderTodayView() {
    const root = document.getElementById("view-today");
    const entry = SCHEDULE.find(s => s.day === state.selectedDay);
    const snack = RECIPES[entry.snack];
    const dinner = RECIPES[entry.dinner];
    const daily = addMacros(getRecipeMacros(snack), getRecipeMacros(dinner));
    const date = dateForPlanDay(state.selectedDay);
    const todayDay = getTodayPlanDay();
    const isToday = state.selectedDay === todayDay;

    root.innerHTML = `
      <div class="issue-banner">
        <h1>${isToday ? "Today’s" : "Day " + state.selectedDay}<br/><em>Spread</em></h1>
        <div class="issue-meta">
          Day ${state.selectedDay} of 14<br/>
          ${formatNiceDate(date)}<br/>
          Week ${state.selectedDay <= 7 ? "1" : "2"}
        </div>
      </div>
      <div class="macro-summary">
        <div class="macro-summary-head">
          <h2>Daily Macros · Snack + Dinner</h2>
          <span class="mono" style="font-size:0.7rem;color:var(--ink-faint)">approx.</span>
        </div>
        ${renderMacroCells(daily, false)}
        ${renderMacroBars(daily)}
      </div>
      ${renderRecipeCard(snack, { mealType: "Afternoon Snack", mealNum: "01" })}
      ${renderRecipeCard(dinner, { mealType: "Evening Dinner", mealNum: "02" })}
    `;
  }

  function renderPlanView() {
    const root = document.getElementById("view-plan");
    const todayDay = getTodayPlanDay();

    function weekHtml(days, title) {
      return `
        <div class="week-block">
          <h2 class="week-title">${title}</h2>
          ${days.map(s => {
            const snack = RECIPES[s.snack];
            const dinner = RECIPES[s.dinner];
            const daily = addMacros(getRecipeMacros(snack), getRecipeMacros(dinner));
            const d = dateForPlanDay(s.day);
            return `
              <button class="day-row ${s.day === todayDay ? "is-today" : ""}" data-goto-day="${s.day}">
                <div class="day-row-top">
                  <span class="dn">Day ${s.day} · ${weekdayShort(d)}</span>
                  <span class="macros">${daily.protein}g P · ${daily.kcal} kcal</span>
                </div>
                <div class="day-row-meals">
                  <div class="m"><span class="tag">Snack</span><span>${escapeHtml(snack.title)}</span></div>
                  <div class="m"><span class="tag">Dinner</span><span>${escapeHtml(dinner.title)}</span></div>
                </div>
              </button>`;
          }).join("")}
        </div>`;
    }

    root.innerHTML = `
      <div class="issue-banner">
        <h1>14-Day<br/><em>Agenda</em></h1>
        <div class="issue-meta">Snacks &amp; dinners<br/>from the plan</div>
      </div>
      ${weekHtml(SCHEDULE.slice(0, 7), "Week One")}
      ${weekHtml(SCHEDULE.slice(7), "Week Two")}
    `;
  }

  function renderLibraryView() {
    const root = document.getElementById("view-library");
    let list = Object.values(RECIPES);
    if (state.libraryFilter === "snack") list = list.filter(r => r.category === "snack");
    else if (state.libraryFilter === "dinner") list = list.filter(r => r.category === "dinner");
    else if (state.libraryFilter === "bonus") list = list.filter(r => r.category === "bonus");

    const q = state.libraryQuery.trim().toLowerCase();
    if (q) list = list.filter(r => r.title.toLowerCase().includes(q) || String(r.num).includes(q));

    list.sort((a, b) => a.num - b.num);

    const chips = [
      ["all", "All"],
      ["snack", "Snacks (8)"],
      ["dinner", "Dinners (12)"],
      ["bonus", "Bonus Soup"]
    ];

    root.innerHTML = `
      <div class="issue-banner">
        <h1>Recipe<br/><em>Index</em></h1>
        <div class="issue-meta">21 recipes<br/>from the book</div>
      </div>
      <div class="lib-toolbar">
        <input class="search-input" id="libSearch" type="search" placeholder="Search recipes…" value="${escapeHtml(state.libraryQuery)}" />
        <div class="filter-row">
          ${chips.map(([id, label]) => `
            <button class="filter-chip ${state.libraryFilter === id ? "is-on" : ""}" data-filter="${id}">${label}</button>
          `).join("")}
        </div>
      </div>
      <div id="libList">
        ${list.length ? list.map(r => {
          const m = getRecipeMacros(r);
          const cat = r.category === "snack" ? "Snack" : r.category === "dinner" ? "Dinner" : "Bonus";
          return `
            <button class="lib-item" data-open-recipe="${r.id}">
              <div class="li-top">
                <span class="li-cat">#${String(r.num).padStart(2,"0")} · ${cat}</span>
                <span class="li-macros">${m.protein}g P · ${m.kcal} kcal</span>
              </div>
              <h3 class="li-title">${escapeHtml(r.title)}</h3>
            </button>`;
        }).join("") : `<div class="empty">No recipes match.</div>`}
      </div>
    `;
  }

  function renderRulesView() {
    const root = document.getElementById("view-rules");
    root.innerHTML = `
      <div class="issue-banner">
        <h1>Portion<br/><em>Rules</em></h1>
        <div class="issue-meta">Strict control<br/>guidelines</div>
      </div>
      <p class="rules-intro">To maintain nutritional consistency across all recipes, stick to these raw and cooked measurement limits.</p>
      <div class="rule-card">
        <h3>Chicken</h3>
        <p>Maximum raw chicken per dish/serving.</p>
        <span class="limit">Max 200g raw</span>
      </div>
      <div class="rule-card">
        <h3>Cooked Rice</h3>
        <p>Derived from approx. 65–70g raw dry basmati rice.</p>
        <span class="limit">Max 200g cooked</span>
      </div>
      <div class="rule-card">
        <h3>Roti / Chapati / Paratha</h3>
        <p>Or 2 stuffed parathas / 2 dosas as specified per recipe.</p>
        <span class="limit">Max 3 pieces</span>
      </div>
      <div class="rule-card">
        <h3>Fish</h3>
        <p>2 fillets/steaks total raw weight.</p>
        <span class="limit">~180–200g raw</span>
      </div>
      <div class="rule-card">
        <h3>Sides &amp; Snacks</h3>
        <p>Calorie &amp; protein optimized with proportional ingredient adjustments as listed on each recipe card.</p>
        <span class="limit">Follow card notes</span>
      </div>
    `;
  }

  function setAppChromeInert(inert) {
    const header = document.querySelector(".app-header");
    const main = document.querySelector("main");
    const nav = document.querySelector(".bottom-nav");
    [header, main, nav].forEach(el => {
      if (!el) return;
      if (inert) el.setAttribute("inert", "");
      else el.removeAttribute("inert");
    });
  }

  function openRecipeDetail(id) {
    const recipe = RECIPES[id];
    if (!recipe) return;
    closeVideoOverlay();
    closeDrawer();
    const sheet = document.getElementById("detailSheet");
    const mealType = recipe.category === "snack" ? "Snack" : recipe.category === "bonus" ? "Bonus" : "Dinner";
    sheet.innerHTML = `
      <button class="detail-close" id="closeDetail">← Back to recipes</button>
      ${renderRecipeCard(recipe, { mealType, mealNum: String(recipe.num).padStart(2, "0") })}
    `;
    sheet.classList.add("open");
    sheet.removeAttribute("inert");
    sheet.setAttribute("aria-hidden", "false");
    sheet.scrollTop = 0;
    document.body.classList.add("sheet-open");
    setAppChromeInert(true);
    const closeBtn = document.getElementById("closeDetail");
    if (closeBtn) closeBtn.focus();
  }

  function closeRecipeDetail() {
    closeVideoOverlay();
    const sheet = document.getElementById("detailSheet");
    sheet.classList.remove("open");
    sheet.setAttribute("inert", "");
    sheet.setAttribute("aria-hidden", "true");
    if (!isVideoOpen()) {
      document.body.classList.remove("sheet-open");
      setAppChromeInert(false);
    }
  }

  function renderAll() {
    renderDayScrubber();
    if (state.view === "today") renderTodayView();
    else if (state.view === "plan") renderPlanView();
    else if (state.view === "library") renderLibraryView();
    else if (state.view === "rules") renderRulesView();

    document.querySelectorAll(".view").forEach(v => {
      const on = v.dataset.view === state.view;
      v.classList.toggle("is-active", on);
      if (on) {
        v.removeAttribute("hidden");
        v.removeAttribute("aria-hidden");
      } else {
        v.setAttribute("hidden", "");
        v.setAttribute("aria-hidden", "true");
        v.innerHTML = "";
      }
    });
    document.querySelectorAll(".nav-item").forEach(n => {
      const on = n.dataset.nav === state.view;
      n.classList.toggle("is-active", on);
      if (on) n.setAttribute("aria-current", "page");
      else n.removeAttribute("aria-current");
    });

    const scrubber = document.getElementById("dayScrubber");
    scrubber.style.display = state.view === "today" ? "flex" : "none";
    document.getElementById("backToday").classList.toggle(
      "visible",
      state.view === "today" && state.selectedDay !== getTodayPlanDay()
    );
  }

  /* ========== THEME / SETTINGS ========== */
  const THEME_ICON_SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const THEME_ICON_MOON = '<path d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5z"/>';

  function applyTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(STORAGE.theme, theme);
    document.getElementById("darkSwitch").classList.toggle("on", theme === "dark");
    document.getElementById("darkSwitch").setAttribute("aria-checked", theme === "dark" ? "true" : "false");
    document.querySelector('meta[name="theme-color"]').setAttribute(
      "content",
      theme === "dark" ? "#121110" : "#FAF6F0"
    );
    const icon = document.getElementById("themeIcon");
    if (icon) icon.innerHTML = theme === "dark" ? THEME_ICON_MOON : THEME_ICON_SUN;
    document.getElementById("themeBtn").setAttribute(
      "aria-label",
      theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
    );
  }

  function openDrawer() {
    if (document.getElementById("detailSheet").classList.contains("open")) closeRecipeDetail();
    const drawer = document.getElementById("settingsDrawer");
    document.getElementById("drawerBackdrop").classList.add("open");
    drawer.classList.add("open");
    drawer.removeAttribute("inert");
    drawer.setAttribute("aria-hidden", "false");
    document.getElementById("startDate").value = state.startDate;
    document.body.classList.add("sheet-open");
    setAppChromeInert(true);
    document.getElementById("startDate").focus();
  }

  function closeDrawer() {
    const drawer = document.getElementById("settingsDrawer");
    document.getElementById("drawerBackdrop").classList.remove("open");
    drawer.classList.remove("open");
    drawer.setAttribute("inert", "");
    drawer.setAttribute("aria-hidden", "true");
    if (!isDetailOpen() && !isVideoOpen()) {
      document.body.classList.remove("sheet-open");
      setAppChromeInert(false);
    }
  }

  async function setWakeLock(on) {
    const sw = document.getElementById("wakeLockSwitch");
    if (on) {
      try {
        if ("wakeLock" in navigator) {
          state.wakeLock = await navigator.wakeLock.request("screen");
          state.wakeLock.addEventListener("release", () => {
            sw.classList.remove("on");
            state.wakeLock = null;
          });
          sw.classList.add("on");
        } else {
          alert("Wake Lock is not supported on this browser.");
        }
      } catch (e) {
        console.warn(e);
        sw.classList.remove("on");
      }
    } else {
      if (state.wakeLock) {
        await state.wakeLock.release();
        state.wakeLock = null;
      }
      sw.classList.remove("on");
    }
  }

  /* ========== EVENTS ========== */
  function bindEvents() {
    document.getElementById("themeBtn").addEventListener("click", () => {
      applyTheme(state.theme === "light" ? "dark" : "light");
    });

    document.getElementById("settingsBtn").addEventListener("click", openDrawer);
    document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);

    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (isVideoOpen()) {
        closeVideoOverlay();
        return;
      }
      if (document.getElementById("settingsDrawer").classList.contains("open")) {
        closeDrawer();
        document.getElementById("settingsBtn").focus();
        return;
      }
      if (isDetailOpen()) {
        closeRecipeDetail();
        return;
      }
    });

    document.getElementById("videoClose").addEventListener("click", closeVideoOverlay);
    document.getElementById("videoOverlay").addEventListener("click", e => {
      if (e.target.id === "videoOverlay") closeVideoOverlay();
    });
    document.getElementById("videoPlayerFrame").addEventListener("click", e => {
      e.stopPropagation();
    });

    document.getElementById("saveStartBtn").addEventListener("click", () => {
      const v = document.getElementById("startDate").value;
      if (!v) return;
      state.startDate = v;
      localStorage.setItem(STORAGE.startDate, v);
      state.selectedDay = getTodayPlanDay();
      closeDrawer();
      renderAll();
    });

    document.getElementById("startTodayBtn").addEventListener("click", () => {
      const v = toISODate(new Date());
      document.getElementById("startDate").value = v;
      state.startDate = v;
      localStorage.setItem(STORAGE.startDate, v);
      state.selectedDay = 1;
      closeDrawer();
      renderAll();
    });

    document.getElementById("darkSwitch").addEventListener("click", () => {
      applyTheme(state.theme === "light" ? "dark" : "light");
    });

    document.getElementById("wakeLockSwitch").addEventListener("click", () => {
      const on = !document.getElementById("wakeLockSwitch").classList.contains("on");
      setWakeLock(on);
      document.getElementById("wakeLockSwitch").setAttribute("aria-checked", on ? "true" : "false");
    });

    document.getElementById("backToday").addEventListener("click", () => {
      state.selectedDay = getTodayPlanDay();
      state.view = "today";
      renderAll();
      scrollActivePill();
    });

    document.getElementById("dayScrubber").addEventListener("click", e => {
      const pill = e.target.closest("[data-day]");
      if (!pill) return;
      state.selectedDay = Number(pill.dataset.day);
      closeVideoOverlay();
      renderAll();
    });

    document.querySelector(".bottom-nav").addEventListener("click", e => {
      const item = e.target.closest("[data-nav]");
      if (!item) return;
      state.view = item.dataset.nav;
      closeVideoOverlay();
      closeRecipeDetail();
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.body.addEventListener("click", e => {
      const play = e.target.closest("[data-play]");
      if (play) {
        openVideoOverlay(play.dataset.play);
        return;
      }

      const servingBtn = e.target.closest("[data-choice]");
      if (servingBtn) {
        const toggle = servingBtn.closest("[data-serving-recipe]");
        const rid = toggle.dataset.servingRecipe;
        setServingChoice(rid, servingBtn.dataset.choice);
        renderAll();
        if (document.getElementById("detailSheet").classList.contains("open")) {
          openRecipeDetail(rid);
        }
        return;
      }

      const goto = e.target.closest("[data-goto-day]");
      if (goto) {
        state.selectedDay = Number(goto.dataset.gotoDay);
        state.view = "today";
        renderAll();
        scrollActivePill();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const openR = e.target.closest("[data-open-recipe]");
      if (openR) {
        openRecipeDetail(openR.dataset.openRecipe);
        return;
      }

      if (e.target.closest("#closeDetail")) {
        closeRecipeDetail();
        return;
      }

      const filter = e.target.closest("[data-filter]");
      if (filter) {
        state.libraryFilter = filter.dataset.filter;
        renderLibraryView();
        return;
      }
    });

    document.body.addEventListener("change", e => {
      if (e.target.matches("[data-check]")) {
        const rid = e.target.dataset.check;
        const idx = Number(e.target.dataset.idx);
        toggleCheck(rid, idx);
        const li = e.target.closest("li");
        if (li) li.classList.toggle("checked", e.target.checked);
      }
    });

    document.body.addEventListener("input", e => {
      if (e.target.id === "libSearch") {
        state.libraryQuery = e.target.value;
        const caret = e.target.selectionStart;
        renderLibraryView();
        const input = document.getElementById("libSearch");
        if (input) {
          input.focus();
          input.setSelectionRange(caret, caret);
        }
      }
    });
  }

  function scrollActivePill() {
    const pill = document.querySelector(".day-pill.is-active");
    if (pill) pill.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  }

  /* ========== INIT ========== */
  function init() {
    const savedTheme = localStorage.getItem(STORAGE.theme) || "light";
    applyTheme(savedTheme);

    let start = localStorage.getItem(STORAGE.startDate);
    if (!start) {
      start = toISODate(mondayOfThisWeek());
      localStorage.setItem(STORAGE.startDate, start);
    }
    state.startDate = start;
    state.selectedDay = getTodayPlanDay();

    bindEvents();
    renderAll();
    requestAnimationFrame(scrollActivePill);
  }

  init();
  </script>
</body>
</html>
